name: Green Rock CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: greenrock
          POSTGRES_PASSWORD: greenrock123
          POSTGRES_DB: greenrock
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: green-rock-platform/package-lock.json

      - name: Install dependencies
        working-directory: green-rock-platform
        run: npm ci

      - name: Generate Prisma Client
        working-directory: green-rock-platform
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://greenrock:greenrock123@localhost:5432/greenrock?schema=public

      - name: Run migrations
        working-directory: green-rock-platform/apps/api
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://greenrock:greenrock123@localhost:5432/greenrock?schema=public

      - name: Run API tests
        working-directory: green-rock-platform
        run: npm run test --workspace=@green-rock/api

      - name: Type check API
        working-directory: green-rock-platform
        run: npm run lint --workspace=@green-rock/api

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: green-rock-platform/package-lock.json

      - name: Install dependencies
        working-directory: green-rock-platform
        run: npm ci

      - name: Build web
        working-directory: green-rock-platform
        run: npm run build --workspace=@green-rock/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1

  docker:
    runs-on: ubuntu-latest
    needs: [test-api, build-web]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build API Docker image
        working-directory: green-rock-platform
        run: docker build -f apps/api/Dockerfile -t green-rock-api .
